<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA R</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c10;--surface:#0d1117;--border:#1e2d3d;--accent:#00f5ff;--accent2:#ff3cac;--accent3:#7b2fff;--text:#e6edf3;--muted:#8b949e;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Space Mono',monospace;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,245,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,255,0.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
header{position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:16px 28px;border-bottom:1px solid var(--border);background:rgba(8,12,16,0.9);}
.logo-area{display:flex;align-items:center;gap:14px;}
.logo-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,var(--accent3),var(--accent));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:16px;color:#fff;}
.logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:22px;background:linear-gradient(90deg,var(--accent),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.status{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);}
.dot{width:8px;height:8px;border-radius:50%;background:#00ff88;animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.badge{font-size:10px;padding:3px 10px;border:1px solid var(--border);border-radius:20px;color:var(--muted);}
#chat{flex:1;overflow-y:auto;padding:24px 20px;position:relative;z-index:5;}
#chat::-webkit-scrollbar{width:4px;}#chat::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.msg{display:flex;gap:14px;margin-bottom:20px;max-width:820px;margin-left:auto;margin-right:auto;animation:fadeIn 0.3s ease forwards;opacity:0;}
@keyframes fadeIn{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(8px)}}
.msg.user{flex-direction:row-reverse;}
.av{width:34px;height:34px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;}
.av.ai{background:linear-gradient(135deg,var(--accent3),var(--accent));color:#fff;}
.av.user{background:#1e2d3d;color:var(--muted);border:1px solid var(--border);}
.bub{max-width:calc(100% - 55px);padding:14px 18px;border-radius:14px;font-size:14px;line-height:1.75;}
.msg.ai .bub{background:var(--surface);border:1px solid var(--border);border-top-left-radius:3px;}
.msg.user .bub{background:linear-gradient(135deg,rgba(0,245,255,0.08),rgba(123,47,255,0.08));border:1px solid rgba(0,245,255,0.2);border-top-right-radius:3px;text-align:right;}
.typing{display:flex;gap:5px;padding:14px 18px;}
.typing span{width:7px;height:7px;border-radius:50%;animation:bounce 1.2s infinite;}
.typing span:nth-child(1){background:var(--accent);}
.typing span:nth-child(2){background:var(--accent3);animation-delay:0.2s;}
.typing span:nth-child(3){background:var(--accent2);animation-delay:0.4s;}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:0.5}40%{transform:translateY(-6px);opacity:1}}
#welcome{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:20px;text-align:center;padding:40px;}
.wlogo{width:80px;height:80px;border-radius:22px;background:linear-gradient(135deg,var(--accent3),var(--accent));display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:32px;color:#fff;animation:float 4s ease-in-out infinite;}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.wtitle{font-family:'Syne',sans-serif;font-weight:800;font-size:34px;background:linear-gradient(90deg,var(--accent),var(--accent3),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.wsub{color:var(--muted);font-size:13px;line-height:1.8;}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px;}
.chip{padding:8px 16px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-family:'Space Mono',monospace;font-size:11px;cursor:pointer;transition:all 0.2s;}
.chip:hover{border-color:var(--accent);color:var(--accent);background:rgba(0,245,255,0.05);}
footer{position:relative;z-index:10;padding:12px 20px 16px;border-top:1px solid var(--border);background:rgba(8,12,16,0.9);}
.iw{max-width:820px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:10px 14px;}
.iw:focus-within{border-color:rgba(0,245,255,0.4);}
#inp{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'Space Mono',monospace;font-size:13px;resize:none;max-height:140px;min-height:24px;line-height:1.6;}
#inp::placeholder{color:var(--muted);opacity:0.7;}
#sbtn{width:36px;height:36px;border-radius:9px;border:none;background:linear-gradient(135deg,var(--accent3),var(--accent));color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.2s;}
#sbtn:hover{transform:scale(1.06);}
#sbtn:disabled{opacity:0.4;cursor:not-allowed;transform:none;}
.hint{text-align:center;font-size:10px;color:var(--muted);margin-top:8px;opacity:0.5;}
.scanline{position:fixed;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:0.3;animation:scan 6s linear infinite;pointer-events:none;z-index:100;}
@keyframes scan{0%{top:0}100%{top:100vh}}
</style>
</head>
<body>
<div class="scanline"></div>
<header>
  <div class="logo-area">
    <div class="logo-icon">R</div>
    <div class="logo-text">IA R</div>
  </div>
  <div style="display:flex;align-items:center;gap:12px;">
    <div class="badge">GEMINI 1.5</div>
    <div class="status"><div class="dot"></div>ONLINE</div>
  </div>
</header>
<div id="chat">
  <div id="welcome">
    <div class="wlogo">R</div>
    <div class="wtitle">Olá, eu sou a IA R</div>
    <div class="wsub">Inteligência artificial avançada, pronta para ajudar.<br>Pergunte qualquer coisa — estou aqui.</div>
    <div class="chips">
      <div class="chip" onclick="fill('O que você pode fazer?')">O que você pode fazer?</div>
      <div class="chip" onclick="fill('Me conte uma curiosidade')">Curiosidade interessante</div>
      <div class="chip" onclick="fill('Me ajude a escrever um texto')">Escrever um texto</div>
      <div class="chip" onclick="fill('O que é inteligência artificial?')">O que é IA?</div>
    </div>
  </div>
</div>
<footer>
  <div class="iw">
    <textarea id="inp" rows="1" placeholder="Digite sua mensagem para a IA R..."></textarea>
    <button id="sbtn" onclick="send()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <div class="hint">ENTER PARA ENVIAR &nbsp;·&nbsp; SHIFT+ENTER PARA NOVA LINHA</div>
</footer>
<script>
const chatEl=document.getElementById('chat');
const inp=document.getElementById('inp');
const sbtn=document.getElementById('sbtn');
let history=[];
let welcomeOn=true;

inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,140)+'px';});
inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});

function fill(t){inp.value=t;inp.focus();inp.dispatchEvent(new Event('input'));}

function rmWelcome(){if(welcomeOn){document.getElementById('welcome')?.remove();welcomeOn=false;}}

function addMsg(role,html){
  rmWelcome();
  const d=document.createElement('div');d.className='msg '+role;
  const av=document.createElement('div');av.className='av '+role;av.textContent=role==='ai'?'R':'U';
  const b=document.createElement('div');b.className='bub';b.innerHTML=html;
  d.appendChild(av);d.appendChild(b);chatEl.appendChild(d);
  chatEl.scrollTop=chatEl.scrollHeight;return d;
}

function addTyping(){
  rmWelcome();
  const d=document.createElement('div');d.className='msg ai';d.id='typ';
  const av=document.createElement('div');av.className='av ai';av.textContent='R';
  const b=document.createElement('div');b.className='bub';
  b.innerHTML='<div class="typing"><span></span><span></span><span></span></div>';
  d.appendChild(av);d.appendChild(b);chatEl.appendChild(d);
  chatEl.scrollTop=chatEl.scrollHeight;return d;
}

function fmt(t){
  t=t.replace(/```[\w]*\n?([\s\S]*?)```/g,(_,c)=>'<pre style="background:#000;border:1px solid #1e2d3d;border-radius:8px;padding:12px;overflow-x:auto;font-size:12px;margin:8px 0;color:#a5d6ff"><code>'+c.trim().replace(/</g,'&lt;')+'</code></pre>');
  t=t.replace(/`([^`]+)`/g,'<code style="background:rgba(0,245,255,0.07);padding:2px 6px;border-radius:4px;color:#00f5ff">$1</code>');
  t=t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  t=t.replace(/\n/g,'<br>');return t;
}

async function send(){
  const text=inp.value.trim();if(!text)return;
  inp.value='';inp.style.height='auto';sbtn.disabled=true;
  addMsg('user',fmt(text));
  history.push({role:'user',content:text});
  const typ=addTyping();
  try{
    const res=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
    const data=await res.json();typ.remove();
    if(data.reply){history.push({role:'assistant',content:data.reply});addMsg('ai',fmt(data.reply));}
    else{addMsg('ai','⚠️ Erro: '+(data.error||'Tente novamente.'));}
  }catch(e){typ.remove();addMsg('ai','⚠️ Erro: '+e.message);}
  sbtn.disabled=false;inp.focus();
}
</script>
</body>
</html>
